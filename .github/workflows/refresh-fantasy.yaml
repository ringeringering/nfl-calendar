name: Refresh fantasy projections

on:
  schedule:
    # Wednesdays 11:40 UTC. Projections settle after Tuesday's roster moves and
    # before Thursday kickoff. Offset from refresh-odds to avoid overlapping
    # pushes to the same branch.
    - cron: '40 11 * * 3'
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing to main at once would conflict; let one finish first.
concurrency:
  group: refresh-fantasy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No API key: ESPN's fantasy read endpoint is public.
      - name: Fetch fantasy projections
        run: python scripts/fetch_fantasy.py
      - name: Commit refreshed projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- fantasy-data.js
          if git diff --cached --quiet; then
            echo "No fantasy changes to commit"
          else
            git commit -m "Refresh fantasy projections"
            git pull --rebase --autostash origin main
            git push
          fi
